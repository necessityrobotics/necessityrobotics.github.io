<script>
// The old 3-D viewer moved: viewer.html?map=<id>&t=<seconds>&cam=...  ->  explore.html?map=<id>&at=<metres>.
// "map" is kept. "t" (seconds along the recording) becomes "at" (whole metres along the camera's path) through
// data/routes.json ([t s, x m, y m, metres] per point). "cam" has no meaning in the new view and is dropped.
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  var map = q.get('map'), t = parseFloat(q.get('t'));
  if (map && /^[a-z0-9_]{3,40}$/.test(map)) out.set('map', map); else map = null;
  ['force3d', 'shot', 'q', 'tier', 'assets'].forEach(function (k) { if (q.has(k)) out.set(k, q.get(k)); });
  function go(at) {
    if (at != null && isFinite(at)) out.set('at', String(Math.max(0, Math.round(at))));
    var s = out.toString();
    location.replace('explore.html' + (s ? '?' + s : ''));
  }
  function atOfTime(pts, t) {
    var lo = 0, hi = pts.length - 1;
    if (t <= pts[0][0]) return pts[0][3];
    if (t >= pts[hi][0]) return pts[hi][3];
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (pts[mid][0] <= t) lo = mid; else hi = mid; }
    var span = pts[hi][0] - pts[lo][0];
    return pts[lo][3] + (pts[hi][3] - pts[lo][3]) * (span > 0 ? (t - pts[lo][0]) / span : 0);
  }
  if (map && isFinite(t) && window.fetch) {
    fetch('data/routes.json').then(function (r) { return r.json(); })
      .then(function (R) { var p = R.routes && R.routes[map] && R.routes[map].pts; go(p && p.length ? atOfTime(p, t) : null); })
      .catch(function () { go(null); });
  } else go(null);
})();
</script>
